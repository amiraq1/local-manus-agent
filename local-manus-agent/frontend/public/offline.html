<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Manus Agent - Offline</title>
  <style>
    body { font-family: system-ui; background: #020617; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
    .container { max-width: 400px; }
    h1 { color: #6366f1; font-size: 1.5rem; }
    p { color: #94a3b8; line-height: 1.6; }
    .retry { margin-top: 20px; padding: 10px 24px; background: #6366f1; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ Local Manus Agent</h1>
    <p>Backend is not reachable. Make sure the server is running:</p>
    <code style="color:#6366f1">python scripts/start.py</code>
    <br><br>
    <button class="retry" onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
