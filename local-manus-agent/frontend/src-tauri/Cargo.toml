[package]
name = "local-manus-agent"
version = "0.9.0"
description = "Local Manus Agent Desktop App"
authors = ["amiraq1"]
license = "MIT"
repository = "https://github.com/amiraq1/local-manus-agent"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open-api", "shell-sidecar", "process-exit", "process-relaunch", "window-close", "window-minimize", "window-maximize", "window-set-title"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
